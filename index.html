<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌶️ Pepper Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="p-4 bg-[#f1f5f9] pb-24 font-['Inter'] text-slate-800">

    <div id="authOverlay" class="fixed inset-0 bg-slate-100 z-[9999] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
            <div class="text-center mb-8">
                <span class="text-4xl">🌶️</span>
                <h2 id="authTitle" class="text-xl font-black text-slate-800 mt-2 uppercase tracking-tight">Entrar</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="authEmail" placeholder="Email" class="input-field w-full">
                <input type="password" id="authPassword" placeholder="Password" class="input-field w-full">
                <div class="flex flex-col gap-3 pt-2">
                    <button onclick="handleAuth()" id="authPrimaryBtn" class="btn-primary w-full shadow-lg">Entrar</button>
                    <button onclick="toggleAuthMode()" id="authSecondaryBtn" class="text-[10px] font-bold text-slate-400 uppercase hover:text-emerald-600 text-center">Não tens conta? Criar Registo</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appContent" class="max-w-xl mx-auto hidden">
        
        <div class="flex justify-between items-center mb-6 bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm">
            <span id="userEmailLabel" class="text-[10px] font-bold text-slate-500 uppercase"></span>
            <button onclick="handleLogout()" class="text-[10px] font-black text-red-400 uppercase hover:bg-red-50 px-3 py-1 rounded-full">Sair 🚪</button>
        </div>

        <header class="mb-6 text-center pt-4">
            <h1 class="text-2xl font-extrabold text-[#1e293b] flex items-center justify-center gap-2">
                <span>🌶️</span> Pepper Tracker
            </h1>
        </header>

        <div id="formContainer" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 transition-all">
            <h2 id="formTitle" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6 border-b pb-2">Novo Registo</h2>
            <input type="hidden" id="editId">
            
            <div class="space-y-4">
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Variedade</label>
                        <input type="text" id="variety" list="pepperCatalog" placeholder="Ex: Jalapeño" class="input-field">
                        <datalist id="pepperCatalog"></datalist>
                    </div>
                    <div class="w-28">
                        <label id="labelQty" class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Sementes</label>
                        <input type="number" id="quantity" value="1" min="1" class="input-field-number w-full">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Data</label>
                        <input type="date" id="startDate" class="input-field">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Etapa</label>
                        <select id="stage" class="input-field" onchange="updateQtyLabel()">
                            <option value="Germinação">Germinação</option>
                            <option value="Plantação">Plantação</option>
                            <option value="Colheita">Colheita</option>
                        </select>
                    </div>
                </div>

                <div id="harvestInputContainer" class="hidden pt-2 border-t border-dashed mt-2">
                    <label class="text-[10px] font-bold text-orange-500 ml-1 uppercase mb-2 block">Frutos por Planta</label>
                    <div id="individualPlantsContainer" class="grid grid-cols-4 gap-2 mb-3"></div>
                    <div class="bg-orange-50 text-orange-700 px-3 py-2 rounded-lg text-[10px] flex justify-between items-center font-bold border border-orange-100">
                        <span>TOTAL COLHIDO:</span>
                        <span id="totalHarvestCalc" class="text-sm">0</span>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button id="mainBtn" onclick="handleAction()" class="btn-primary shadow-sm">Gravar Lote</button>
                    <button id="cancelBtn" onclick="resetForm()" class="hidden btn-cancel px-4">✕</button>
                </div>
            </div>
        </div>

        <div id="plantList" class="space-y-4"></div>

        <details class="mt-12 group">
            <summary class="text-center list-none cursor-pointer text-[10px] font-bold uppercase tracking-widest text-slate-400 py-4">
                Arquivo Histórico <span id="archiveCount">(0)</span>
            </summary>
            <div id="archiveList" class="mt-2 space-y-4"></div>
        </details>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
